name: Limpar Actions
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # todas as segundas-feiras
permissions:
  actions: write
jobs:
  limpar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Apagar execuções antigas (mantém as 5 mais recentes)
        run: |
          gh run list -R ${{ github.repository }} --limit 1000 --json databaseId,status -q '.[] | select(.status=="completed") | .databaseId' \
            | tail -n +6 \
            | xargs -r -I{} sh -c 'gh run delete {} -R ${{ github.repository }} || true'
      - name: Apagar artefactos antigos (mantém os 3 mais recentes)
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --paginate -q '.artifacts[].id' \
            | tail -n +4 \
            | xargs -r -I{} sh -c 'gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{} || true'
