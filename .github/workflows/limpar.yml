name: Limpar Actions
on: workflow_dispatch
permissions:
  actions: write
jobs:
  limpar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Apagar artefactos
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --paginate -q '.artifacts[].id' \
            | xargs -r -I{} gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{}
      - name: Apagar execuções antigas
        run: |
          gh run list -R ${{ github.repository }} --limit 1000 --json databaseId -q '.[].databaseId' \
            | xargs -r -I{} gh run delete {} -R ${{ github.repository }}
