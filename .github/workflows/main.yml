name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        continue-on-error: true   # a quota de artefactos do GitHub pode estar cheia; o APK vai também para Releases
        with:
          name: CockpitTV-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1
          overwrite: true

      - name: Publicar o APK em Releases (não conta para a quota de artefactos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest app/build/outputs/apk/release/*.apk --title "CockpitTV (último APK)" --notes "APK mais recente, compilado automaticamente." --target "${{ github.sha }}"
