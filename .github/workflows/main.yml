name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Descompactar o projeto
        run: |
          unzip -q cockpit-tv-android.zip -d proj
          S=$(find proj -name settings.gradle | head -1)
          if [ -z "$S" ]; then echo "ERRO: settings.gradle não encontrado no zip"; exit 1; fi
          echo "PROJ=$(dirname "$S")" >> $GITHUB_ENV

      - name: Compilar
        working-directory: ${{ env.PROJ }}
        run: gradle assembleRelease --no-daemon

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: CockpitTV-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
